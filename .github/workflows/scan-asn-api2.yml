name: '测试版-CF反代扫描(多ASN独立CSV)'

on:
  workflow_dispatch:
    inputs:
      target_input:
        description: '扫描目标 (支持多个 ASN/CIDR，用空格隔开，如 AS203923 AS13335)'
        required: true
        default: 'AS203923'
      ports_input:
        description: '需要扫描的端口号 (多个端口用空格或逗号隔开，如 443 8443)'
        required: true
        default: '443 8443'
      masscan_rate_input:
        description: 'Masscan 发包速率 (pps，推荐 3000 ~ 10000)'
        required: true
        default: '3000'
      py_concurrency_input:
        description: 'Python 握手并发数 (单进程并发，推荐 50 ~ 200)'
        required: true
        default: '50'
      iptest_speedtest_input:
        description: 'iptest 测速协程数 (默认 0 即不测速，仅测延迟与机房信息)'
        required: false
        default: '0'

jobs:
  scan:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Install System Tools & Dependencies
        run: |
          echo "[*] 正在安装系统工具和 Python 依赖..."
          sudo apt-get update -y > /dev/null
          sudo apt-get install -y masscan jq wget curl > /dev/null
          python -m pip install --upgrade pip -q
          if [ -f 脚本/requirements.txt ]; then pip install -r 脚本/requirements.txt -q; fi
          pip install cryptography uvloop aiohttp -q

          echo "[*] 正在获取并安装 Kwisma/iptest..."
          INSTALLED=0
          RELEASE_URL=$(curl -sL https://api.github.com/repos/Kwisma/iptest/releases/latest | jq -r '.assets[]? | select(.name | test("linux.*amd64|amd64.*linux"; "i")) | .browser_download_url' | head -n 1)
          
          if [ -n "$RELEASE_URL" ] && [ "$RELEASE_URL" != "null" ]; then
            echo "[*] 正在下载 Release 预编译包: $RELEASE_URL"
            wget -q "$RELEASE_URL" -O iptest_pkg
            if tar -ztf iptest_pkg >/dev/null 2>&1; then
              tar -zxf iptest_pkg
            elif unzip -t iptest_pkg >/dev/null 2>&1; then
              unzip -o iptest_pkg
            else
              chmod +x iptest_pkg
              mv iptest_pkg iptest
            fi
            if [ -f iptest ]; then
              sudo mv iptest /usr/local/bin/iptest
              sudo chmod +x /usr/local/bin/iptest
              INSTALLED=1
            fi
          fi

          if [ $INSTALLED -eq 0 ]; then
            echo "[*] 未拉取到可用二进制，正在通过源码编译 Kwisma/iptest..."
            git clone --depth 1 https://github.com/Kwisma/iptest.git .tmp_iptest_build
            cd .tmp_iptest_build
            go build -o iptest iptest.go
            sudo mv iptest /usr/local/bin/iptest
            sudo chmod +x /usr/local/bin/iptest
            cd ..
            rm -rf .tmp_iptest_build
          fi

          echo "[*] 提前预下载 iptest 离线数据库文件..."
          wget -q -nc https://locations-adw.pages.dev/locations.json || true
          wget -q -nc https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-ASN.mmdb || true
          wget -q -nc https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-Country.mmdb || true

          echo "[+] 环境安装完毕！"

      - name: Scan and Process Targets Loop
        env:
          CUSTOM_CF_DOMAIN: ${{ secrets.CUSTOM_CF_DOMAIN }}
          STAGE1_CONCURRENCY: ${{ inputs.py_concurrency_input }}
          IPTEST_SPEEDTEST: ${{ inputs.iptest_speedtest_input }}
        run: |
          ulimit -n 65535
          mkdir -p .tmp
          mkdir -p "优选反代ip"

          TARGET_LIST=$(echo "${{ inputs.target_input }}" | tr ',' ' ')

          for TARGET in $TARGET_LIST; do
            echo "=================================================="
            echo "[*] 开始处理目标: ${TARGET}"
            echo "=================================================="

            rm -f .tmp/targets.txt .tmp/scan_info.json .tmp/masscan_out.json

            # 1. 调用独立解析脚本，无内联代码
            python "脚本/resolve_targets.py" "${TARGET}"

            TOTAL_IPS=$(jq -r '.total_ips' .tmp/scan_info.json 2>/dev/null || echo 0)
            if [ "$TOTAL_IPS" -eq 0 ]; then
              echo "[-] 目标 ${TARGET} 没有解析到有效 IP，跳过。"
              continue
            fi

            PORTS=$(echo "${{ inputs.ports_input }}" | tr ' ' ',')
            echo "[*] 开始对 ${TARGET} 发起 Masscan 探活..."

            # 2. Masscan 扫描
            sudo masscan -iL .tmp/targets.txt -p "$PORTS" --rate "${{ inputs.masscan_rate_input }}" --wait 0 -oJ .tmp/masscan_out.json > /dev/null 2>&1 || true

            if [ ! -s .tmp/masscan_out.json ]; then
              echo "[-] ${TARGET} 未发现开放端口。"
              continue
            fi

            # 3. 运行主筛选及 iptest 脚本
            python "脚本/cf_scan_api3.py" "${TARGET}" "${{ inputs.ports_input }}" .tmp/masscan_out.json

            echo "[+] ${TARGET} 处理完毕！"
          done

          # 清理 0 字节 CSV 文件
          find "优选反代ip" -maxdepth 2 -name "*.csv" -size 0 -delete

      - name: Cleanup Temp Files
        run: |
          rm -rf .tmp
          rm -f locations.json GeoLite2-ASN.mmdb GeoLite2-Country.mmdb

      - name: Commit and Push Results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "*.csv" "**/*.csv" 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "[!] 没有检测到有效结果更新，跳过提交。"
          else
            echo "[*] 检测到结果更新，正在提交..."
            git commit -m "Update CF scan CSV results [skip ci]"
            git push
          fi
