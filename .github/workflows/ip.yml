name: '端口扫描'

on:
  workflow_dispatch:
    inputs:
      target_ip:
        description: '扫描目标 (例如: 1.1.1.1/24 或 AS203923)'
        required: true
        default: '1.1.1.1/24'
      ports:
        description: '扫描端口 (例如: 1-65535 或 443,8443)'
        required: true
        default: '1-65535'
      rate:
        description: '扫描发包速率 (rate)'
        required: true
        default: '200000'

jobs:
  scan-and-parse:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 安装 Masscan 和 Python 环境
        run: |
          sudo apt-get update
          sudo apt-get install -y masscan python3

      - name: 执行 Masscan 扫描
        run: |
          # 清理历史旧文件
          rm -f masscan_out.json result.txt
          
          # 执行扫描，通过 tr 转换退格符并过滤出 10% 整数梯度的进度屏显
          sudo stdbuf -oL masscan ${{ github.event.inputs.target_ip }} \
            -p${{ github.event.inputs.ports }} \
            --rate=${{ github.event.inputs.rate }} \
            -oJ masscan_out.json 2>&1 | tr '\r' '\n' | grep -E "(10\.00%|20\.00%|30\.00%|40\.00%|50\.00%|60\.00%|70\.00%|80\.00%|90\.00%|100\.00%)" || true

      - name: 运行 Python 脚本解析 IP:端口
        run: |
          if [ -f masscan_out.json ]; then
            python3 脚本/ip.py "" "" masscan_out.json > result.txt
          else
            echo "[-] 扫描未生成任何有效数据！"
            exit 1
          fi

      - name: 控制台展示结果
        run: |
          cat result.txt

      - name: 上传提取到的结果文件 (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ip-ports-result
          path: result.txt
