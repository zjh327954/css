name: '标准'

on:
  workflow_dispatch:
    inputs:
      target_input:
        description: '扫描目标 (支持 ASN 如 AS203923 或 IP段如 203.66.11.0/20)'
        required: true
        default: 'AS'
      ports_input:
        description: '需要扫描的端口号 (多个端口用空格或逗号隔开，如 443 8443 或 1-65535)'
        required: true
        default: '443 8443 2053 2083 2087 2096'
      masscan_rate_input:
        description: 'Masscan 发包速率 (pps，推荐 5000 ~ 15000)'
        required: true
        default: '2000'
      py_concurrency_input:
        description: 'Python 握手并发数 (单进程并发，推荐 500 ~ 2000)'
        required: true
        default: '100'

jobs:
  scan:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Tools & Dependencies
        run: |
          echo "[*] 正在安装系统工具和 Python 依赖..."
          sudo apt-get update -y > /dev/null
          sudo apt-get install -y masscan > /dev/null
          python -m pip install --upgrade pip -q
          if [ -f requirements.txt ]; then pip install -r requirements.txt -q; fi
          pip install cryptography uvloop aiohttp -q
          echo "[+] 环境安装完毕！"

      - name: Run Masscan Probe
        run: |
          # 1. 解析目标 ASN 或 CIDR，计算总 IP 数并记录 ASN 标识
          python -c "
          import sys, json, urllib.request, ipaddress, re

          target_raw = '''${{ inputs.target_input }}'''.strip()
          cidrs = []
          asn_info = '无 (自定义 IP 段)'

          if target_raw.upper().startswith('AS'):
              asn = target_raw.upper().replace('AS', '').strip()
              asn_info = f'AS{asn}'
              try:
                  url = f'https://stat.ripe.net/data/announced-prefixes/data.json?resource=AS{asn}'
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      data = json.loads(resp.read().decode())
                      for p in data.get('data', {}).get('prefixes', []):
                          prefix = p.get('prefix')
                          if prefix and ':' not in prefix:
                              cidrs.append(prefix)
              except Exception as e:
                  print(f'获取 ASN 失败: {e}')
          else:
              raw_cidrs = re.split(r'[\s,\n]+', target_raw)
              for c in raw_cidrs:
                  c = c.strip()
                  if c:
                      cidrs.append(c)

          total_ips = 0
          valid_cidrs = []

          for c in cidrs:
              try:
                  net = ipaddress.ip_network(c, strict=False)
                  total_ips += net.num_addresses
                  valid_cidrs.append(str(net))
              except Exception:
                  pass

          with open('targets.txt', 'w') as f:
              for c in valid_cidrs:
                  f.write(c + '\n')

          with open('scan_info.json', 'w') as f:
              json.dump({'total_ips': total_ips, 'asn': asn_info}, f)
          "
          
          # 2. 读取 ASN 信息、计算端口数与总扫描数量并在扫描前打印
          PORTS=$(echo "${{ inputs.ports_input }}" | tr ' ' ',')
          TOTAL_IPS=$(python -c "import json; print(json.load(open('scan_info.json'))['total_ips'])")
          TARGET_ASN=$(python -c "import json; print(json.load(open('scan_info.json'))['asn'])")
          PORT_COUNT=$(echo "$PORTS" | awk -F',' '{print NF}')
          TOTAL_SCANS=$((TOTAL_IPS * PORT_COUNT))

          echo "[*] 目标 ASN: ${TARGET_ASN} | IP 数量: ${TOTAL_IPS} | 端口数量: ${PORT_COUNT} | 预计总扫描数: ${TOTAL_SCANS}"
          echo "[*] 正在运行 Masscan 探活 (设定发包速率: ${{ inputs.masscan_rate_input }} pps)..."
          
          # 3. 运行 Masscan 探活并在终端打印百分比进度
          python -c "
          import subprocess, sys, re

          cmd = ['sudo', 'masscan', '-iL', 'targets.txt', '-p', '$PORTS', '--rate', '${{ inputs.masscan_rate_input }}', '--wait', '0', '-oJ', 'masscan_out.json']
          process = subprocess.Popen(cmd, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, bufsize=1)

          last_milestone = 0
          pattern = re.compile(r'([\d\.]+)%\s+done.*found=(\d+)')

          for line in process.stdout:
              match = pattern.search(line)
              if match:
                  pct = float(match.group(1))
                  found = match.group(2)
                  milestone = int(pct // 10) * 10
                  if milestone > last_milestone and milestone <= 100:
                      print(f'  [Masscan 探活进度] {milestone}% | 已发现开放端口: {found} 个', flush=True)
                      last_milestone = milestone

          process.wait()
          "
          echo "[+] Masscan 探活完成！"

      - name: Run ASN / IP Scan
        env:
          CUSTOM_CF_DOMAIN: ${{ secrets.CUSTOM_CF_DOMAIN }}
          STAGE1_CONCURRENCY: ${{ inputs.py_concurrency_input }}
        run: |
          ulimit -n 65535
          python "脚本/check_cf_asn.py" "${{ inputs.target_input }}" "${{ inputs.ports_input }}" masscan_out.json

      - name: Check if valid result files exist
        id: check_files
        run: |
          HAS_VALID_IP=false

          # 只关注 git 变动的 txt 文件，如果里面没写进 IP 就直接删掉
          for f in $(git status --porcelain | awk '{print $2}' | grep '\.txt$' | grep -v 'targets.txt'); do
            if [ -s "$f" ] && grep -E -q '([0-9]{1,3}\.){3}[0-9]{1,3}' "$f"; then
              HAS_VALID_IP=true
              echo "[+] 发现有效 IP 结果文件: $f"
            else
              echo "[-] 清理本次生成的无有效 IP 文件: $f"
              rm -f "$f"
            fi
          done

          if [ "$HAS_VALID_IP" = "true" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "[*] 检测到有效 IP 输出，准备提交代码。"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "[!] 本次扫描未产生有效 IP 结果，跳过提交。"
          fi

      - name: Commit and Push TXT Results
        if: steps.check_files.outputs.has_changes == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update scanned ASN txt files [skip ci]"
          file_pattern: "**/*.txt"
