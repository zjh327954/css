name: '每日扫描'

on:
  schedule:
    # 北京时间每天 09:10 触发 (UTC 01:10)
    - cron: '10 1 * * *'

  workflow_dispatch:
    inputs:
      ports_input:
        description: '需要扫描的端口号 (多个端口用空格分隔)'
        required: true
        default: '443 8443 2053 2083 2087 2096'
      concurrency_input:
        description: '单进程并发速率 (如 1000/1500/2000)'
        required: true
        default: '100'

jobs:
  scan:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install cryptography uvloop aiohttp

      - name: Run ASN / IP Scan
        env:
          CUSTOM_CF_DOMAIN: ${{ secrets.CUSTOM_CF_DOMAIN }}
          # 使用 env 变量做二重保险，防止 inputs 为空
          PORTS: ${{ inputs.ports_input }}
          CONCURRENCY: ${{ inputs.concurrency_input }}
        run: |
          ulimit -n 65535
          
          # 如果 PORTS 为空（即定时任务触发），自动赋予保底默认值
          TARGET_PORTS="${PORTS:-443 8443 2053 2083 2087 2096}"
          TARGET_CONCURRENCY="${CONCURRENCY:-100}"
          
          export STAGE1_CONCURRENCY="$TARGET_CONCURRENCY"
          python "脚本/check_cf_asn5.py" "$TARGET_PORTS"

      - name: Commit and Push Results
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: 更新扫描结果 [skip ci]"
          file_pattern: "**/*.txt"
