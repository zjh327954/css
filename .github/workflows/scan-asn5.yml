name: '每日扫描'

on:
  # 1. 每日定时任务：UTC 0:00 对应北京时间 08:00
  schedule:
    - cron: '0 0 * * *'

  # 2. 手动触发配置
  workflow_dispatch:
    inputs:
      ports_input:
        description: '需要扫描的端口号 (多个端口用空格分隔)'
        required: true
        default: '443 8443 2053 2083 2087 2096'
      concurrency_input:
        description: '单进程并发速率 (如 1000/1500/2000)'
        required: true
        default: '100'

jobs:
  scan:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install cryptography uvloop aiohttp

      - name: Run ASN / IP Scan
        env:
          CUSTOM_CF_DOMAIN: ${{ secrets.CUSTOM_CF_DOMAIN }}
          STAGE1_CONCURRENCY: ${{ inputs.concurrency_input || '100' }}
        run: |
          ulimit -n 65535
          # 根据文件放置位置自行确认路径 (如果在根目录把 脚本/ 去掉即可)
          python "脚本/check_cf_asn5.py" "${{ inputs.ports_input || '443 8443 2053 2083 2087 2096' }}"

      - name: Commit and Push Results
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: 更新扫描结果 [skip ci]"
          file_pattern: "**/*.txt"
