name: '每日扫描'

on:
  # 1. 每日自动定时扫描 (北京时间每天凌晨 04:00 自动执行)
  schedule:
    - cron: '0 23 * * *'

  # 2. 手动触发扫描模式
  workflow_dispatch:
    inputs:
      region_input:
        description: '筛选国家/地区 (如 香港 日本 新加坡，留空默认亚洲全部)'
        required: false
        default: ''
      ports_input:
        description: '需要扫描的端口号 (多个端口用空格或逗号隔开)'
        required: true
        default: '443 8443 2053 2083 2087 2096'
      masscan_rate_input:
        description: 'Masscan 发包速率 (pps，推荐 5000 ~ 15000)'
        required: true
        default: '1000'
      py_concurrency_input:
        description: 'Python 握手并发数 (单进程并发，推荐 500 ~ 2000)'
        required: true
        default: '500'

jobs:
  scan:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Tools & Dependencies
        run: |
          echo "[*] 正在安装系统工具和 Python 依赖..."
          sudo apt-get update -y > /dev/null
          sudo apt-get install -y masscan > /dev/null
          python -m pip install --upgrade pip -q
          if [ -f requirements.txt ]; then pip install -r requirements.txt -q; fi
          pip install cryptography uvloop aiohttp -q
          echo "[+] 环境安装完毕！"

      - name: Run Masscan Probe
        run: |
          rm -f masscan_out.json targets.txt
          
          # 1. 精准提取 `优选asn段/*.txt` 中的亚洲 CIDR 网段
          python -c "
          import os, glob, re

          # 亚洲国家与地区识别关键词
          ASIA_KEYWORDS = [
              '香港', 'HK', 'Hong Kong',
              '日本', 'JP', 'Japan',
              '新加坡', 'SG', 'Singapore',
              '台湾', 'TW', 'Taiwan',
              '韩国', 'KR', 'Korea',
              '马来西亚', 'MY', 'Malaysia',
              '泰国', 'TH', 'Thailand',
              '越南', 'VN', 'Vietnam',
              '菲律宾', 'PH', 'Philippines',
              '印度尼西亚', '印尼', 'ID', 'Indonesia',
              '印度', 'IN', 'India',
              '阿联酋', '迪拜', 'AE', 'Dubai', 'UAE',
              '土耳其', 'TR', 'Turkey'
          ]

          user_region = '${{ inputs.region_input || '' }}'.strip()

          def is_target_region(label):
              label_upper = label.upper()
              if user_region:
                  return user_region.upper() in label_upper
              for kw in ASIA_KEYWORDS:
                  if kw.upper() in label_upper:
                      return True
              return False

          asn_dir = '优选asn段'
          cidrs = []

          if os.path.exists(asn_dir):
              for p in glob.glob(os.path.join(asn_dir, '*.txt')):
                  try:
                      with open(p, 'r', encoding='utf-8', errors='ignore') as f:
                          operator = ''
                          country_region = ''
                          for line in f:
                              raw_line = line.rstrip()
                              if not raw_line.strip():
                                  continue
                              
                              indent_level = len(raw_line) - len(raw_line.lstrip())
                              clean_line = raw_line.strip()
                              found = re.findall(r'(?:\d{1,3}\.){3}\d{1,3}(?:/\d{1,2})?', clean_line)

                              if not found:
                                  if indent_level == 0:
                                      if clean_line in ['移动', '联通', '电信']:
                                          operator = clean_line
                                          country_region = ''
                                      else:
                                          operator = ''
                                          country_region = clean_line
                                  elif indent_level in [2, 4]:
                                      country_region = clean_line
                              else:
                                  full_label = f'{operator} {country_region}'.strip() if operator else country_region
                                  if is_target_region(country_region) or is_target_region(full_label):
                                      cidrs.extend(found)
                  except Exception as e:
                      print(f'[-] 读取失败 {p}: {e}')

          cidrs = list(dict.fromkeys(cidrs))
          filter_tag = user_region if user_region else '默认亚洲'
          print(f'[+] 精准提取 [{filter_tag}] CIDR 完成，共提取到 {len(cidrs)} 个网段写入 targets.txt')
          
          with open('targets.txt', 'w', encoding='utf-8') as f:
              for c in cidrs:
                  f.write(c + '\n')
          "
          
          # 2. 运行 Masscan 发包探活
          PORTS=$(echo "${{ inputs.ports_input || '443 8443 2053 2083 2087 2096' }}" | tr ' ' ',')
          RATE="${{ inputs.masscan_rate_input || '1000' }}"
          echo "[*] 正在运行 Masscan 探活 (设定发包速率: $RATE pps)..."
          
          python -c "
          import subprocess, sys, re

          cmd = ['sudo', 'masscan', '-iL', 'targets.txt', '-p', '$PORTS', '--rate', '$RATE', '--wait', '0', '-oJ', 'masscan_out.json']
          process = subprocess.Popen(cmd, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, bufsize=1)

          last_milestone = 0
          pattern = re.compile(r'([\d\.]+)%\s+done.*found=(\d+)')

          for line in process.stdout:
              match = pattern.search(line)
              if match:
                  pct = float(match.group(1))
                  found = match.group(2)
                  milestone = int(pct // 10) * 10
                  if milestone > last_milestone and milestone <= 100:
                      print(f'  [Masscan 探活进度] {milestone}% | 已发现开放端口: {found} 个', flush=True)
                      last_milestone = milestone

          process.wait()
          "
          echo "[+] Masscan 探活完成！"

      - name: Run ASN / IP Scan
        env:
          CUSTOM_CF_DOMAIN: ${{ secrets.CUSTOM_CF_DOMAIN }}
          STAGE1_CONCURRENCY: ${{ inputs.py_concurrency_input || '500' }}
        run: |
          ulimit -n 65535
          python "脚本/check_cf_asn5.py" "masscan_out.json" "${{ inputs.region_input || '' }}"

      - name: Commit and Push TXT Results
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update scanned ASN txt files [skip ci]"
          file_pattern: "自用/*.txt"
          skip_checkout: true
