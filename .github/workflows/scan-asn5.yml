name: '每日扫描'

on:
  # 1. 每日定时自动运行 (UTC 时间 18:00，即北京时间凌晨 02:00)
  schedule:
    - cron: '0 21 * * *'

  # 2. 手动触发运行，支持自定义参数输入
  workflow_dispatch:
    inputs:
      scan_ports:
        description: '要扫描的端口列表 (逗号分隔)'
        required: false
        default: '443,8443,2053,2083,2087,2096'
      masscan_rate:
        description: 'Masscan 扫描速率 (pps 发包率)'
        required: false
        default: '5000'
      stage1_concurrency:
        description: 'Python 校验阶段单进程并发数'
        required: false
        default: '200'

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 安装 Masscan 扫描工具与 Python 环境
        run: |
          sudo apt-get update
          sudo apt-get install -y masscan
          python3 -m pip install --upgrade pip
          pip install uvloop || true

      - name: 提取并合并亚洲段 CIDR 列表
        run: |
          # 确保脚本有运行权限，提取亚洲段文本中的所有 CIDR 并整理入 target_cidrs.txt
          mkdir -p 临时缓存
          if [ -f "优选asn段/亚洲段.txt" ]; then
            grep -E -o '([0-9]{1,3}\.){3}[0-9]{1,3}(/[0-9]{1,2})?' 优选asn段/亚洲段.txt > 临时缓存/target_cidrs.txt || true
          fi
          
          # 如果亚洲段 txt 内包含引用文件名/ASN 编号，也一并提取 CIDR
          if [ -f "优选asn段/亚洲段.txt" ]; then
            while read -r line; do
              clean_line=$(echo "$line" | sed 's/\.txt//g' | sed 's/AS//g' | tr -d '\r')
              if [ -f "优选asn段/${clean_line}.txt" ]; then
                grep -E -o '([0-9]{1,3}\.){3}[0-9]{1,3}(/[0-9]{1,2})?' "优选asn段/${clean_line}.txt" >> 临时缓存/target_cidrs.txt || true
              fi
            done < 优选asn段/亚洲段.txt
          fi

          # 去重去空
          sort -u 临时缓存/target_cidrs.txt -o 临时缓存/target_cidrs.txt
          echo "[+] 待扫描的目标 CIDR 段数量: $(wc -l < 临时缓存/target_cidrs.txt)"

      - name: 执行 Masscan 端口探活
        run: |
          PORTS="${{ github.event.inputs.scan_ports || '443,8443,2053,2083,2096' }}"
          RATE="${{ github.event.inputs.masscan_rate || '10000' }}"
          
          echo "[*] 开始 Masscan 端口扫描..."
          echo "[*] 端口目标: $PORTS"
          echo "[*] 发包速率: $RATE pps"

          if [ ! -s "临时缓存/target_cidrs.txt" ]; then
            echo "[-] 错误：未能提取到有效的 CIDR 目标网段！"
            exit 1
          fi

          sudo masscan -iL 临时缓存/target_cidrs.txt \
            -p"$PORTS" \
            --rate="$RATE" \
            -oJ masscan_out.json \
            --wait 2

          echo "[+] Masscan 探活完成，结果已保存至 masscan_out.json"

      - name: 执行 Python 三阶段精细校验与归类
        env:
          STAGE1_CONCURRENCY: ${{ github.event.inputs.stage1_concurrency || '1500' }}
          CUSTOM_CF_DOMAIN: "327954.ccwu.cc"
        run: |
          echo "[*] 开始启动 Python 验证脚本..."
          python3 daily_scan5.py masscan_out.json

      - name: 提交并推送结果到 GitHub 仓库
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add 自用/*.txt
          if git diff --cached --quiet; then
            echo "[*] 扫描结果没有变化，无需更新提交。"
          else
            git commit -m "auto: 更新每日亚洲优选反代 IP 列表 [$(date -u +'%Y-%m-%d %H:%M') UTC]"
            git push
            echo "[+] 新的优选 IP 结果已成功推送至仓库！"
          fi
