name: '每日扫描'

on:
  # 1. 每日定时自动运行 (UTC 时间 18:00，即北京时间凌晨 02:00)
  schedule:
    - cron: '0 23 * * *'

  # 2. 手动触发运行，支持自定义参数输入
  workflow_dispatch:
    inputs:
      scan_ports:
        description: '要扫描的端口列表 (逗号分隔)'
        required: false
        default: '443,8443,2053,2083,2087,2096'
      masscan_rate:
        description: 'Masscan 扫描速率 (pps 发包率)'
        required: false
        default: '5000'
      stage1_concurrency:
        description: 'Python 校验阶段单进程并发数'
        required: false
        default: '200'

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 安装 Masscan 与 Python 环境
        run: |
          echo "[*] 正在静默安装 Masscan 与 Python 依赖..."
          sudo apt-get update -qq
          sudo apt-get install -y -qq masscan > /dev/null
          python3 -m pip install --upgrade pip -q
          pip install uvloop -q || true
          echo "[+] 环境准备完成！"

      - name: 提取【优选asn段】亚洲 CIDR 列表并统计测试目标
        run: |
          mkdir -p 临时缓存
          touch 临时缓存/target_cidrs.txt

          ASN_PATH="优选asn段"
          if [ ! -d "$ASN_PATH" ] && [ -d "脚本/优选asn段" ]; then
            ASN_PATH="脚本/优选asn段"
          fi

          echo "[*] 正在解析 '$ASN_PATH' 中的亚洲 IP 段..."

          # 全量匹配亚洲国家与地区的关键字（涵盖东亚、东南亚、南亚、中东及其英文与简写）
          ASIA_PATTERN="香港|日本|新加坡|韩国|台湾|澳门|马来西亚|泰国|越南|菲律宾|印度尼西亚|印尼|柬埔寨|老挝|缅甸|文莱|印度|巴基斯坦|孟加拉|阿联酋|迪拜|土耳其|沙特|卡塔尔|科威特|阿曼|以色列|哈萨克斯坦|hk|hongkong|hong kong|jp|japan|sg|singapore|kr|korea|tw|taiwan|mo|macau|my|malaysia|th|thailand|vn|vietnam|ph|philippines|id|indonesia|kh|cambodia|la|laos|mm|myanmar|bn|brunei|in|india|pk|pakistan|bd|bangladesh|ae|uae|dubai|tr|turkey|sa|saudi|qa|qatar|kw|kuwait|om|oman|il|israel|kz|kazakhstan"

          # 遍历 优选asn段 下的所有 txt 文件
          shopt -s nullglob
          for f in "$ASN_PATH"/*.txt; do
            if grep -i -E "$ASIA_PATTERN" "$f" > /dev/null 2>&1; then
              grep -E -o '([0-9]{1,3}\.){3}[0-9]{1,3}(/[0-9]{1,2})?' "$f" >> 临时缓存/target_cidrs.txt || true
            fi
          done

          # 兜底：如果未检索到特定关键词文件，则提取该目录下所有 CIDR
          if [ ! -s 临时缓存/target_cidrs.txt ]; then
            grep -h -E -o '([0-9]{1,3}\.){3}[0-9]{1,3}(/[0-9]{1,2})?' "$ASN_PATH"/*.txt >> 临时缓存/target_cidrs.txt || true
          fi

          sort -u 临时缓存/target_cidrs.txt -o 临时缓存/target_cidrs.txt

          # 动态获取端口参数，计算端口数量
          PORTS="${{ github.event.inputs.scan_ports || '443,8443,2053,2083,2096' }}"
          
          # 单行 Python 逻辑，避免 YAML 语法与缩进冲突
          python3 -c "import ipaddress; ports='$PORTS'.split(','); p_cnt=len(ports); cidrs=[ipaddress.ip_network(l.strip(), False) for l in open('临时缓存/target_cidrs.txt') if l.strip()]; ips=sum(n.num_addresses for n in cidrs); print(f'[*] 解析完成：共提取 {len(cidrs):,} 个 CIDR 网段 | {ips:,} 个 IP × {p_cnt} 个端口 = 共 {ips*p_cnt:,} 个测试目标。')"

      - name: 执行 Masscan 端口探活
        run: |
          PORTS="${{ github.event.inputs.scan_ports || '443,8443,2053,2083,2096' }}"
          RATE="${{ github.event.inputs.masscan_rate || '10000' }}"
          
          echo "[*] 开始 Masscan 端口扫描 (速率: $RATE pps)..."

          if [ ! -s "临时缓存/target_cidrs.txt" ]; then
            echo "[-] 错误：未能提取到有效的 CIDR 目标网段！"
            exit 1
          fi

          sudo masscan -iL 临时缓存/target_cidrs.txt \
            -p"$PORTS" \
            --rate="$RATE" \
            -oJ masscan_out.json \
            --wait 2

          echo "[+] Masscan 探活完成，结果已保存至 masscan_out.json"

      - name: 执行 Python 三阶段精细校验与归类
        env:
          STAGE1_CONCURRENCY: ${{ github.event.inputs.stage1_concurrency || '1500' }}
          CUSTOM_CF_DOMAIN: "327954.ccwu.cc"
        run: |
          echo "[*] 开始启动 Python 验证脚本..."
          python3 check_cf_asn5.py masscan_out.json

      - name: 提交并推送结果到 GitHub 仓库
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add 自用/*.txt
          if git diff --cached --quiet; then
            echo "[*] 扫描结果没有变化，无需更新提交。"
          else
            git commit -m "auto: 更新每日亚洲优选反代 IP 列表 [$(date -u +'%Y-%m-%d %H:%M') UTC]"
            git push
            echo "[+] 新的优选 IP 结果已成功推送至仓库！"
          fi
