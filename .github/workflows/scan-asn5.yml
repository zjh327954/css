name: '每日ip'

on:
  schedule:
    # 国际标准时间 (UTC) 00:00 对应北京/香港时间 (UTC+8) 08:00
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      ports_input:
        description: '需要扫描的端口号 (多个端口用逗号或空格隔开)'
        required: true
        default: '443, 8443, 2053, 2083, 2087, 2096'
      concurrency_input:
        description: '单进程并发速率'
        required: true
        default: '100'

jobs:
  scan:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install cryptography uvloop aiohttp

      - name: Run Scan Script
        env:
          CUSTOM_CF_DOMAIN: ${{ secrets.CUSTOM_CF_DOMAIN }}
          STAGE1_CONCURRENCY: ${{ github.event.inputs.concurrency_input || '100' }}
        run: |
          ulimit -n 65535
          PORTS="${{ github.event.inputs.ports_input }}"
          PORTS="${PORTS:-443, 8443, 2053, 2083, 2087, 2096}"
          python "脚本/check_cf_asn5.py" "default" "$PORTS" "default"

      - name: Commit and Push TXT Results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 暂存仓库根目录下的三个生成文件
          git add ./日本.txt ./香港.txt ./新加坡.txt || true
          
          # 仅在有内容变更时触发提交与推送
          if ! git diff --staged --quiet; then
            git pull origin main --rebase --autostash
            git commit -m "Update scanned Asia TXT files [skip ci]"
            git push
          else
            echo "未检测到文本节点变动，跳过提交。"
          fi
