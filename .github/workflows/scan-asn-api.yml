name: '测试版-CF反代扫描(含API精筛)'

on:
  workflow_dispatch:
    inputs:
      target_input:
        description: '扫描目标 (支持 ASN 如 AS203923 或 IP段如 203.66.11.0/20)'
        required: true
        default: 'AS'
      ports_input:
        description: '需要扫描的端口号 (多个端口用空格或逗号隔开，如 443 8443 或 1-65535)'
        required: true
        default: '443 8443 2053 2083 2087 2096'
      masscan_rate_input:
        description: 'Masscan 发包速率 (pps，推荐 5000 ~ 15000)'
        required: true
        default: '2000'
      py_concurrency_input:
        description: 'Python 握手并发数 (单进程并发，推荐 500 ~ 2000)'
        required: true
        default: '50'

jobs:
  scan:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Tools & Dependencies
        run: |
          echo "[*] 正在安装系统工具和 Python 依赖..."
          sudo apt-get update -y > /dev/null
          sudo apt-get install -y masscan > /dev/null
          python -m pip install --upgrade pip -q
          if [ -f 脚本/requirements.txt ]; then pip install -r 脚本/requirements.txt -q; fi
          pip install cryptography uvloop aiohttp -q
          echo "[+] 环境安装完毕！"

      - name: Run Masscan Probe
        run: |
          mkdir -p .tmp
          
          # 1. 解析目标 ASN 或 CIDR
          python -c "
          import sys, json, urllib.request, ipaddress, re

          target_raw = '''${{ inputs.target_input }}'''.strip()
          cidrs = []
          asn_info = '无 (自定义 IP 段)'

          if target_raw.upper().startswith('AS'):
              asn = target_raw.upper().replace('AS', '').strip()
              asn_info = f'AS{asn}'
              try:
                  url = f'https://stat.ripe.net/data/announced-prefixes/data.json?resource=AS{asn}'
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      data = json.loads(resp.read().decode())
                      for p in data.get('data', {}).get('prefixes', []):
                          prefix = p.get('prefix')
                          if prefix and ':' not in prefix:
                              cidrs.append(prefix)
              except Exception as e:
                  print(f'获取 ASN 失败: {e}')
          else:
              raw_cidrs = re.split(r'[\s,\n]+', target_raw)
              for c in raw_cidrs:
                  c = c.strip()
                  if c:
                      cidrs.append(c)

          total_ips = 0
          valid_cidrs = []
          for c in cidrs:
              try:
                  net = ipaddress.ip_network(c, strict=False)
                  total_ips += net.num_addresses
                  valid_cidrs.append(str(net))
              except Exception:
                  pass

          with open('.tmp/targets.txt', 'w') as f:
              for c in valid_cidrs:
                  f.write(c + '\n')
          with open('.tmp/scan_info.json', 'w') as f:
              json.dump({'total_ips': total_ips, 'asn': asn_info}, f)
          "

          # 2. 打印扫描信息
          PORTS=$(echo "${{ inputs.ports_input }}" | tr ' ' ',')
          TOTAL_IPS=$(python -c "import json; print(json.load(open('.tmp/scan_info.json'))['total_ips'])")
          TARGET_ASN=$(python -c "import json; print(json.load(open('.tmp/scan_info.json'))['asn'])")
          PORT_COUNT=$(echo "$PORTS" | awk -F',' '{print NF}')
          TOTAL_SCANS=$((TOTAL_IPS * PORT_COUNT))

          echo "[*] 目标 ASN: ${TARGET_ASN} | IP 数量: ${TOTAL_IPS} | 端口数量: ${PORT_COUNT} | 预计总扫描数: ${TOTAL_SCANS}"
          echo "[*] 正在运行 Masscan 探活 (设定发包速率: ${{ inputs.masscan_rate_input }} pps)..."

          # 3. Masscan 探活
          python -c "
          import subprocess, sys, re

          cmd = ['sudo', 'masscan', '-iL', '.tmp/targets.txt', '-p', '$PORTS', '--rate', '${{ inputs.masscan_rate_input }}', '--wait', '0', '-oJ', '.tmp/masscan_out.json']
          process = subprocess.Popen(cmd, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, bufsize=1)

          last_milestone = 0
          pattern = re.compile(r'([\d\.]+)%\s+done.*found=(\d+)')

          for line in process.stdout:
              match = pattern.search(line)
              if match:
                  pct = float(match.group(1))
                  found = match.group(2)
                  milestone = int(pct // 10) * 10
                  if milestone > last_milestone and milestone <= 100:
                      print(f'  [Masscan 探活进度] {milestone}% | 已发现开放端口: {found} 个', flush=True)
                      last_milestone = milestone

          process.wait()
          "
          echo "[+] Masscan 探活完成！"

      - name: Run CF Scan + API 精筛
        env:
          CUSTOM_CF_DOMAIN: ${{ secrets.CUSTOM_CF_DOMAIN }}
          STAGE1_CONCURRENCY: ${{ inputs.py_concurrency_input }}
        run: |
          ulimit -n 65535
          python "脚本/cf_scan_api.py" "${{ inputs.target_input }}" "${{ inputs.ports_input }}" .tmp/masscan_out.json

          # 清理空文件
          find . -maxdepth 3 -name "*.csv" -size 0 -delete

      - name: Cleanup Temp Files
        run: |
          rm -rf .tmp

      - name: Commit and Push Results
        run: |
          git add "*.csv" "**/*.csv" 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "[!] 没有检测到有效结果更新，跳过提交。"
          else
            echo "[*] 检测到结果更新，正在提交..."
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update CF scan results [skip ci]"
            git push
          fi
