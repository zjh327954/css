name: '标准'

on:
  workflow_dispatch:
    inputs:
      target_input:
        description: '扫描目标 (支持 ASN 如 AS206300 或 IP段如 203.66.11.0/20)'
        required: true
        default: 'AS'
      region_input:
        description: '筛选国家/地区/大洲 (如 亚洲、asia、HK DE、香港 德国，留空提取全部)'
        required: false
        default: '亚洲'
      ports_input:
        description: '需要扫描的端口号 (多个端口用空格或逗号隔开，如 443 8443 或 1-65535)'
        required: true
        default: '443 8443 2053 2083 2087 2096'
      masscan_rate_input:
        description: 'Masscan 发包速率 (pps，推荐 5000 ~ 15000)'
        required: true
        default: '3000'
      py_concurrency_input:
        description: 'Python 握手并发数 (单进程并发，推荐 500 ~ 2000)'
        required: true
        default: '100'

jobs:
  scan:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Tools & Dependencies
        run: |
          echo "[*] 正在安装系统工具和 Python 依赖..."
          sudo apt-get update -y > /dev/null
          sudo apt-get install -y masscan > /dev/null
          python -m pip install --upgrade pip -q
          if [ -f requirements.txt ]; then pip install -r requirements.txt -q; fi
          pip install cryptography uvloop aiohttp -q
          echo "[+] 环境安装完毕！"

      - name: Run Masscan Probe
        run: |
          rm -f masscan_out.json targets.txt
          
          # 1. 优先读取本地 优选asn段/*.txt，按地区与大洲精准提取 CIDR，否则查 API 兜底
          python -c "
          import os, sys, json, urllib.request, re, ipaddress

          target = '${{ inputs.target_input }}'.strip()
          region_filter = '${{ inputs.region_input }}'.strip().lower()
          
          # 亚洲国家/地区关键词列表
          ASIA_REGIONS = ['香港', '台湾', '日本', '新加坡', '韩国', '中国', 'hk', 'tw', 'jp', 'sg', 'kr', 'cn']
          aliases = {'hk': '香港', 'tw': '台湾', 'jp': '日本', 'sg': '新加坡', 'us': '美国', 'de': '德国'}
          
          target_region = aliases.get(region_filter, region_filter)

          cidrs = []
          asn_clean = target.upper().replace('AS', '')

          local_file = None
          if asn_clean.isdigit():
              for p in [f'优选asn段/{asn_clean}.txt', f'优选asn段/AS{asn_clean}.txt']:
                  if os.path.exists(p):
                      local_file = p
                      break

          if local_file:
              print(f'[*] 发现本地地区文件: {local_file}，正在按地区 [{region_filter or \"全部\"}] 提取 CIDR...')
              current_region = ''
              with open(local_file, 'r', encoding='utf-8', errors='ignore') as f:
                  for line in f:
                      line_str = line.strip()
                      if not line_str:
                          continue
                      found = re.findall(r'(?:\d{1,3}\.){3}\d{1,3}(?:/\d{1,2})?', line_str)
                      if found:
                          is_match = False
                          if not target_region:
                              is_match = True
                          elif target_region in ['asia', '亚洲']:
                              if any(k in current_region.lower() for k in ASIA_REGIONS):
                                  is_match = True
                          elif target_region in current_region.lower():
                              is_match = True

                          if is_match:
                              cidrs.extend(found)
                      else:
                          # 遇到新文本标签行，直接覆盖更新当前地区名称，避免状态污染累加
                          current_region = line_str
          else:
              print(f'[*] 未找到本地地区文件，回退至在线 API 查询整段 CIDR...')
              if target.upper().startswith('AS'):
                  try:
                      url = f'https://stat.ripe.net/data/announced-prefixes/data.json?resource=AS{asn_clean}'
                      req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                      with urllib.request.urlopen(req, timeout=10) as resp:
                          data = json.loads(resp.read().decode())
                          for p in data.get('data', {}).get('prefixes', []):
                              prefix = p.get('prefix')
                              if prefix and ':' not in prefix:
                                  cidrs.append(prefix)
                  except Exception as e:
                      print(f'[-] 获取 ASN 失败: {e}')
              else:
                  cidrs.append(target)

          cidrs = list(dict.fromkeys(cidrs))
          print(f'[+] 最终筛选提取到 {len(cidrs)} 个目标 CIDR 段写入 targets.txt')
          
          with open('targets.txt', 'w', encoding='utf-8') as f:
              for c in cidrs:
                  f.write(c + '\n')
          "
          
          # 2. 运行 Masscan 发包探活，实时解析打印 10% 阶段进度
          PORTS=$(echo "${{ inputs.ports_input }}" | tr ' ' ',')
          echo "[*] 正在运行 Masscan 探活 (设定发包速率: ${{ inputs.masscan_rate_input }} pps)..."
          
          python -c "
          import subprocess, sys, re

          cmd = ['sudo', 'masscan', '-iL', 'targets.txt', '-p', '$PORTS', '--rate', '${{ inputs.masscan_rate_input }}', '--wait', '0', '-oJ', 'masscan_out.json']
          process = subprocess.Popen(cmd, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, bufsize=1)

          last_milestone = 0
          pattern = re.compile(r'([\d\.]+)%\s+done.*found=(\d+)')

          for line in process.stdout:
              match = pattern.search(line)
              if match:
                  pct = float(match.group(1))
                  found = match.group(2)
                  milestone = int(pct // 10) * 10
                  if milestone > last_milestone and milestone <= 100:
                      print(f'  [Masscan 探活进度] {milestone}% | 已发现开放端口: {found} 个', flush=True)
                      last_milestone = milestone

          process.wait()
          "
          echo "[+] Masscan 探活完成！"

      - name: Run ASN / IP Scan
        env:
          TARGET_LIST: ${{ inputs.target_input }}
          CUSTOM_CF_DOMAIN: ${{ secrets.CUSTOM_CF_DOMAIN }}
          STAGE1_CONCURRENCY: ${{ inputs.py_concurrency_input }}
        run: |
          ulimit -n 65535
          python "脚本/check_cf_asn4.py" "${{ inputs.target_input }}" "${{ inputs.ports_input }}" "masscan_out.json" "${{ inputs.region_input }}"

      - name: Commit and Push TXT Results
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update scanned ASN txt files [skip ci]"
          file_pattern: "优选反代ip/*.txt **/*.txt"
          skip_checkout: true
