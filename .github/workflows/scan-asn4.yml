name: '测试'

on:
  workflow_dispatch:
    inputs:
      target_input:
        description: '扫描目标 (支持 ASN 如 AS36002、IP段如 203.66.11.0/20)'
        required: true
        default: 'AS36002'
      region_input:
        description: '筛选国家/地区/大洲 (如 亚洲、asia、HK DE、香港 德国，留空提取全部)'
        required: false
        default: ''
      ports_input:
        description: '需要扫描的端口号 (多个端口用逗号或空格隔开)'
        required: true
        default: '443 8443 2053 2083 2096'
      masscan_rate_input:
        description: 'Masscan 发包速率 (pps，推荐 5000 ~ 15000)'
        required: true
        default: '10000'
      py_concurrency_input:
        description: 'Python 握手并发数 (单进程并发，推荐 500 ~ 2000)'
        required: true
        default: '1500'

jobs:
  scan:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Tools & Dependencies
        run: |
          echo "::group::安装系统工具和 Python 依赖"
          sudo apt-get update -y > /dev/null
          sudo apt-get install -y masscan > /dev/null
          python -m pip install --upgrade pip -q
          if [ -f requirements.txt ]; then pip install -r requirements.txt -q; fi
          pip install cryptography uvloop aiohttp -q
          echo "[+] 环境安装完毕！"
          echo "::endgroup::"

      - name: Run Masscan Probe
        run: |
          echo "::group::执行 Masscan 探活与 IP 提取"
          echo "[*] 读取本地 优选asn段/XX.txt，精准提取 IP 段..."
          python -c "
          import sys, json, urllib.request, os, re

          target = '${{ inputs.target_input }}'.strip()
          raw_region = '${{ inputs.region_input }}'.strip()
          asn_clean = target.upper().replace('AS', '')
          cidrs = []

          # 基础映射 (全小写)
          aliases = {
              'hk': ['hk', 'hongkong', '香港'],
              'tw': ['tw', 'taiwan', '台湾'],
              'jp': ['jp', 'japan', '日本'],
              'sg': ['sg', 'singapore', '新加坡'],
              'us': ['us', 'usa', '美国'],
              'uk': ['uk', 'united kingdom', '英国'],
              'kr': ['kr', 'korea', '韩国'],
              'de': ['de', 'germany', '德国'],
              'fr': ['fr', 'france', '法国'],
              'in': ['in', 'india', '印度'],
              'th': ['th', 'thailand', '泰国'],
              'vn': ['vn', 'vietnam', '越南'],
              'my': ['my', 'malaysia', '马来西亚'],
              'ph': ['ph', 'philippines', '菲律宾'],
              'id': ['id', 'indonesia', '印尼', '印度尼西亚']
          }

          asia_keywords = ['hk', 'tw', 'jp', 'sg', 'kr', 'in', 'th', 'vn', 'my', 'ph', 'id', '香港', '台湾', '日本', '新加坡', '韩国', '亚洲', '印度', '泰国', '越南', '马来西亚', '菲律宾', '印尼']

          # 提取关键词
          target_keywords = set()
          if raw_region:
              tokens = re.split(r'[\s,;|]+', raw_region)
              for t in tokens:
                  if not t:
                      continue
                  t_lower = t.lower()
                  if t_lower in ['亚洲', 'asia']:
                      target_keywords.update(asia_keywords)
                  elif t_lower in aliases:
                      target_keywords.update(aliases[t_lower])
                  else:
                      target_keywords.add(t_lower)

          local_paths = [
              f'优选asn段/{asn_clean}.txt',
              f'优选asn段/AS{asn_clean}.txt'
          ]
          found_local = False
          for p in local_paths:
              if os.path.isfile(p):
                  found_local = True
                  print(f'[*] 发现本地文件 {p}，开始筛选关键词 {list(target_keywords) or \"[全部]\"} 的 IP 段...')
                  
                  current_section = ''
                  with open(p, 'r', encoding='utf-8', errors='ignore') as f:
                      for line in f:
                          line_str = line.strip()
                          if not line_str:
                              continue
                          
                          found_cidrs = re.findall(r'(?:\d{1,3}\.){3}\d{1,3}(?:/\d{1,2})?', line_str)
                          if found_cidrs:
                              if target_keywords:
                                  # 只要标题中包含任意一个关键词（忽略大小写），就保留
                                  sec_lower = current_section.lower()
                                  if any(k in sec_lower for k in target_keywords):
                                      cidrs.extend(found_cidrs)
                              else:
                                  cidrs.extend(found_cidrs)
                          else:
                              current_section = line_str
                  break

          if not found_local and asn_clean.isdigit():
              print(f'[*] 本地无该 ASN 文件，发起 API 提取全局 AS{asn_clean}...')
              try:
                  url = f'https://stat.ripe.net/data/announced-prefixes/data.json?resource=AS{asn_clean}'
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      data = json.loads(resp.read().decode())
                      for p in data.get('data', {}).get('prefixes', []):
                          prefix = p.get('prefix')
                          if prefix and ':' not in prefix:
                              cidrs.append(prefix)
              except Exception as e:
                  print(f'获取 ASN 失败: {e}')
          elif not found_local:
              cidrs.append(target)

          unique_cidrs = list(set(cidrs))
          with open('targets.txt', 'w') as f:
              for c in unique_cidrs:
                  f.write(c + '\n')
          print(f'[+] 过滤完成！成功向 targets.txt 写入 {len(unique_cidrs)} 个精准 CIDR 段')
          "
          
          if [ ! -s targets.txt ]; then
            echo "[-] 未匹配到符合条件的 IP 段，退出扫描！"
            echo "::endgroup::"
            exit 1
          fi

          PORTS=$(echo "${{ inputs.ports_input }}" | tr ' ' ',')
          echo "[*] 正在运行 Masscan 探活 (速率: ${{ inputs.masscan_rate_input }} pps)..."
          
          python -c "
          import subprocess, sys, re

          cmd = ['sudo', 'masscan', '-iL', 'targets.txt', '-p', '$PORTS', '--rate', '${{ inputs.masscan_rate_input }}', '--wait', '0', '-oJ', 'masscan_out.json']
          process = subprocess.Popen(cmd, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, bufsize=1)

          last_milestone = 0
          pattern = re.compile(r'([\d\.]+)%\s+done.*found=(\d+)')

          for line in process.stdout:
              match = pattern.search(line)
              if match:
                  pct = float(match.group(1))
                  found = match.group(2)
                  milestone = int(pct // 10) * 10
                  if milestone > last_milestone and milestone <= 100:
                      print(f'  [Masscan 探活进度] {milestone}% | 已发现开放端口: {found} 个', flush=True)
                      last_milestone = milestone

          process.wait()
          "
          echo "[+] Masscan 探活完成！"
          echo "::endgroup::"

      - name: Run ASN / IP Scan
        env:
          CUSTOM_CF_DOMAIN: ${{ secrets.CUSTOM_CF_DOMAIN }}
          STAGE1_CONCURRENCY: ${{ inputs.py_concurrency_input }}
        run: |
          echo "::group::运行 Python 握手扫描脚本"
          ulimit -n 65535
          python "脚本/check_cf_asn4.py" "${{ inputs.target_input }}" "${{ inputs.ports_input }}" "masscan_out.json" "${{ inputs.region_input }}"
          echo "::endgroup::"

      - name: Commit and Push TXT Results
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update scanned ASN txt files [skip ci]"
          file_pattern: "**/*.txt"
