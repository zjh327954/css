name: '二改证书'

on:
  workflow_dispatch:
    inputs:
      target_input:
        description: '扫描目标 (支持 ASN 如 AS36002、IP段如 203.66.11.0/20)'
        required: true
        default: 'AS'
      ports_input:
        description: '需要扫描的端口号 (多个端口用逗号或空格隔开)'
        required: true
        default: '443 8443'
      concurrency_input:
        description: '单进程并发速率 (如 1000/1500/2000)'
        required: true
        default: '100'

jobs:
  scan:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install cryptography uvloop aiohttp

      - name: Run ASN / IP Scan
        env:
          CUSTOM_CF_DOMAIN: ${{ secrets.CUSTOM_CF_DOMAIN }}
          STAGE1_CONCURRENCY: ${{ github.event.inputs.concurrency_input }}
        run: |
          ulimit -n 65535
          python check_cf_asn3.py "${{ github.event.inputs.target_input }}" "${{ github.event.inputs.ports_input }}"

      - name: Commit and Push TXT Results
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update scanned ASN txt files [skip ci]"
          file_pattern: "*.txt"
