name: '二改证书'

on:
  workflow_dispatch:
    inputs:
      target_input:
        description: '扫描目标 (支持 ASN 如 AS36002、IP段如 203.66.11.0/20)'
        required: true
        default: 'AS'
      ports_input:
        description: '需要扫描的端口号 (多个端口用逗号或空格隔开)'
        required: true
        default: '443 8443'
      concurrency_input:
        description: '单进程并发速率 (如 1000/1500/2000)'
        required: true
        default: '100'

# 增加并发控制，当多个工作流同时推送到 main 分支时自动排队
concurrency:
  group: git-push-main
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史以保障 rebase 顺利进行

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install cryptography uvloop aiohttp

      - name: Run ASN / IP Scan
        env:
          CUSTOM_CF_DOMAIN: ${{ secrets.CUSTOM_CF_DOMAIN }}
          STAGE1_CONCURRENCY: ${{ github.event.inputs.concurrency_input }}
        run: |
          ulimit -n 65535
          python check_cf_asn3.py "${{ github.event.inputs.target_input }}" "${{ github.event.inputs.ports_input }}"

      - name: Commit and Push TXT Results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add *.txt

          if ! git diff --staged --quiet; then
            git commit -m "Update scanned ASN txt files [skip ci]"
            for i in {1..5}; do
              echo "尝试推送到远程仓库 (第 $i 次)..."
              git pull --rebase origin main && git push origin main && break
              echo "推送发生冲突，等待 2 秒后重试..."
              sleep 2
            done
          else
            echo "没有任何 txt 结果变更，跳过提交。"
          fi
